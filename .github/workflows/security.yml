name: security
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners and deps
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q bandit pip-audit
          python -m pip install -q -r requirements.txt
      - name: pip-audit
        run: pip-audit -r requirements.txt
      - name: Bandit (high severity)
        run: bandit -q -r app.py invoice_extract.py -lll
      - name: Secret scan
        run: |
          if grep -RInE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
             --exclude-dir=.git --exclude-dir=__pycache__ .; then
            echo "secret pattern found"; exit 1
          fi
